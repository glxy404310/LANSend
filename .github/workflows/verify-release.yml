name: Verify release archives
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric ID of the candidate Release
        required: true
        type: string

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: LANSend-Windows-x64.zip
          - os: macos-latest
            archive: LANSend-macOS-universal.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # GitHub requires push access to read a draft Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -eu
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          for name in "$ARCHIVE" SHA256SUMS.txt; do
            asset=$(gh api "$release" --jq ".assets[] | select(.name==\"$name\") | .id")
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$name"
          done
          PY=python
          command -v "$PY" >/dev/null 2>&1 || PY=python3
          "$PY" -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["ARCHIVE"]); assert hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name in pathlib.Path("SHA256SUMS.txt").read_text().splitlines()'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive LANSend-Windows-x64.zip candidate
          foreach ($file in @('candidate/LANSend.exe', 'candidate/THIRD-PARTY-NOTICES.txt')) {
            if (!(Test-Path $file -PathType Leaf) -or (Get-Item $file).Length -eq 0) {
              throw "Missing or empty release file: $file"
            }
          }
      - if: runner.os == 'macOS'
        run: |
          mkdir candidate
          ditto -x -k LANSend-macOS-universal.zip candidate
          test -s candidate/THIRD-PARTY-NOTICES.txt
          codesign --verify --deep --strict candidate/LANSend.app
          for binary in candidate/LANSend.app/Contents/Resources/engine candidate/LANSend.app/Contents/MacOS/LANSend; do
            lipo "$binary" -verify_arch arm64
            lipo "$binary" -verify_arch x86_64
          done
